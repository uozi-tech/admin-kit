catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

# overrides 中的 vite: 8.3.1 也会改写 peer 范围；文档站用到的这些插件本身支持 Vite 7，
# 放行 vitepress>vite 固定的 7.3.6，避免安装时报 unmet peer。
peerDependencyRules:
  allowedVersions:
    '@vitejs/plugin-vue>vite': 7.3.6
    unplugin>vite: 7.3.6
    vue-router>vite: 7.3.6

shellEmulator: true

packages:
  - 'packages/*'
  - '!packages/create-uozi-admin/template'
  - playground
  - docs

overrides:
  '@antdv-next/auto-import-resolver': 1.2.0
  '@antdv-next/icons': 1.1.2
  '@v-c/slider': 1.1.4
  '@vue/compiler-core': 3.5.43
  '@vue/compiler-dom': 3.5.43
  '@vue/compiler-sfc': 3.5.43
  '@vue/compiler-ssr': 3.5.43
  '@vue/runtime-core': 3.5.43
  '@vue/runtime-dom': 3.5.43
  '@vue/server-renderer': 3.5.43
  '@vue/shared': 3.5.43
  antdv-next: 1.5.6
  chokidar: ^5.0.0
  semver: ^7.8.5
  undici-types: 8.11.2
  vite: 8.3.1
  vitepress>@vitejs/plugin-vue: ^6.0.9
  # VitePress 1.x 的 generateBundle 通过直接写 bundle 对象生成 *.lean.js，
  # Rolldown（Vite 8）会忽略这种写法，构建成功但页面首屏加载的 lean chunk 全部 404。
  # 升级到支持 Vite 8 的 VitePress 2 之前，文档站保持使用 Vite 7。
  vitepress>vite: 7.3.6
  vue: 3.5.43
  vue-router: 5.3.1

# pnpm 10.3–10.25：仅识别 onlyBuiltDependencies（strictDepBuilds 默认 true）
# pnpm ≥10.26 / v11：使用 allowBuilds；v11 起不再读取 onlyBuiltDependencies，两处都写以兼容 CI 上的旧 pnpm
allowBuilds:
  core-js: true
  esbuild: true
  simple-git-hooks: true
  typescript: true
  vite: true
  vitest: true
  vue: true
  vue-tsc: true

onlyBuiltDependencies:
  - core-js
  - esbuild
  - simple-git-hooks
  - typescript
  - vite
  - vitest
  - vue
  - vue-tsc

# trustPolicy: no-downgrade


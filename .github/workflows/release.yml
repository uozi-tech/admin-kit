name: Release

on:
  push:
    branches:
      - main
      - next
    paths:
      - 'packages/**'
      - '.changeset/**'
      - eslint.config.mjs
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# permissions:
#   id-token: write # Required for OIDC
#   contents: read

jobs:
  release:
    name: Release
    if: github.repository == 'uozi-tech/admin-kit'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup

      - name: Code Check
        run: pnpm lint

      - name: Check Template Dependencies
        run: pnpm check:template

      - name: Type Check
        run: pnpm typecheck

      # changesets/action v2 no longer writes ~/.npmrc from NPM_TOKEN,
      # so write it here the same way v1 did (skipped when the secret is unset,
      # leaving trusted publishing via id-token untouched).
      - name: Configure npm Auth
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release Pull Request or Publish to npm
        # https://github.com/changesets/action
        # github-token defaults to github.token (v2 ignores the GITHUB_TOKEN env var)
        uses: changesets/action@v2.1.2
        with:
          # this expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: pnpm release
          version-script: pnpm version-packages

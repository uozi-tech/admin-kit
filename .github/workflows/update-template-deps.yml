name: Update Template Dependencies

on:
  push:
    paths:
      - packages/curd/package.json
      - packages/layout-antdv/package.json
      - packages/request/package.json
      - packages/shared-config/package.json
      - pnpm-workspace.yaml
      - packages/create-uozi-admin/scripts/sync-template-deps.mjs
      - .github/workflows/update-template-deps.yml
    branches:
      - main
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'uozi-tech/admin-kit'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 模板不是 workspace 成员，不能使用 catalog: / workspace:，
      # 由脚本把 @uozi-admin/* 的当前版本和根 catalog 中的版本写成具体的 semver 范围
      - name: Update Template Dependencies
        id: update-deps
        run: |
          CHANGES=$(node packages/create-uozi-admin/scripts/sync-template-deps.mjs)

          if git diff --quiet -- packages/create-uozi-admin/template/package.json; then
            echo "No version changes detected, skipping update"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$CHANGES"
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          {
            echo 'changes<<CHANGES_EOF'
            echo "$CHANGES"
            echo 'CHANGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Changeset
        if: steps.update-deps.outputs.needs_update == 'true'
        env:
          CHANGES: ${{ steps.update-deps.outputs.changes }}
        run: |
          mkdir -p .changeset
          CHANGE_ID=$(date +%s%N | md5sum | head -c 8)
          {
            echo '---'
            echo '"create-uozi-admin": patch'
            echo '---'
            echo
            echo 'Update template dependencies:'
            echo
            echo "$CHANGES"
          } > ".changeset/$CHANGE_ID.md"

      - name: Create Pull Request
        if: steps.update-deps.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(create-uozi-admin): update template dependencies'
          title: 'chore(create-uozi-admin): update template dependencies'
          body: |
            Auto update template project dependencies version:

            ${{ steps.update-deps.outputs.changes }}
          branch: update-template-deps
          base: main
          labels: |
            automated pr
          delete-branch: true
